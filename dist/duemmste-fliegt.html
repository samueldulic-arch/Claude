<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a1f">
<title>Der Dümmste fliegt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Der Dümmste fliegt – Quiz-Partyspiel
   ========================================================= */

:root {
  --bg:           #0b0a1f;
  --bg-2:         #14103a;
  --panel:        rgba(255, 255, 255, 0.06);
  --panel-solid:  #1b1740;
  --border:       rgba(255, 255, 255, 0.12);
  --text:         #f4f2ff;
  --muted:        #a49fd0;
  --accent:       #ffce3a;
  --accent-2:     #ff4d8d;
  --good:         #2fd67a;
  --bad:          #ff4d5e;
  --shadow:       0 18px 45px rgba(0, 0, 0, 0.45);
  --radius:       18px;
  --font:         "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

/* Grundfarbe, damit auch unterhalb des Inhalts nichts weiß durchscheint */
html { background: var(--bg); }

body {
  font-family: var(--font);
  color: var(--text);
  background:
    radial-gradient(circle at 15% 0%, #2a1a63 0%, transparent 55%),
    radial-gradient(circle at 85% 10%, #4a1350 0%, transparent 50%),
    linear-gradient(170deg, var(--bg) 0%, var(--bg-2) 100%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  width: min(920px, 100%);
  margin: 0 auto;
  padding: 22px 16px 60px;
}

/* ---------- Typografie / Bausteine ---------- */

h1, h2, h3 { margin: 0 0 10px; line-height: 1.15; }

.logo {
  text-align: center;
  margin: 10px 0 26px;
}
.logo .kicker {
  letter-spacing: .32em;
  text-transform: uppercase;
  font-size: .72rem;
  color: var(--muted);
}
.logo h1 {
  font-size: clamp(2rem, 7vw, 3.4rem);
  font-weight: 800;
  background: linear-gradient(100deg, var(--accent) 10%, var(--accent-2) 90%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 6px 30px rgba(255, 77, 141, .25);
}
.logo p { color: var(--muted); margin: 4px 0 0; font-size: .95rem; }

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  backdrop-filter: blur(6px);
  box-shadow: var(--shadow);
}

.label {
  display: block;
  font-size: .78rem;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--muted);
  margin-bottom: 8px;
}

.hint { color: var(--muted); font-size: .88rem; margin: 6px 0 0; }

button { font-family: inherit; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: 999px;
  padding: 14px 26px;
  font-size: 1.05rem;
  font-weight: 700;
  color: #241a00;
  background: linear-gradient(100deg, var(--accent), #ffb02e);
  cursor: pointer;
  transition: transform .12s ease, filter .12s ease;
  box-shadow: 0 10px 24px rgba(255, 176, 46, .25);
}
.btn:hover  { filter: brightness(1.07); }
.btn:active { transform: translateY(2px); }
.btn.block  { width: 100%; }
.btn.ghost {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
  box-shadow: none;
  font-weight: 600;
}
.btn.ghost:hover { background: rgba(255,255,255,.07); }
.btn.small { padding: 9px 16px; font-size: .9rem; }

/* ---------- Auswahl-Chips (Spielerzahl, Optionen) ---------- */

.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.chip {
  border: 1px solid var(--border);
  background: rgba(255,255,255,.04);
  color: var(--text);
  border-radius: 12px;
  padding: 10px 16px;
  font-size: .95rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .12s ease;
}
.chip:hover { background: rgba(255,255,255,.1); }
.chip[aria-pressed="true"] {
  background: linear-gradient(100deg, var(--accent), #ffb02e);
  border-color: transparent;
  color: #241a00;
}
.chip.num { min-width: 54px; text-align: center; }

/* ---------- Spielerliste ---------- */

.players {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 10px;
}
.player-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255,255,255,.05);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px 12px;
}
.avatar {
  width: 34px; height: 34px;
  flex: 0 0 34px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 800;
  color: #16122e;
  font-size: 1rem;
}
.player-row input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 1rem;
  font-family: inherit;
  padding: 6px 0;
}
.player-row input:focus { outline: none; }

/* ---------- Einstellungen ---------- */

details.settings summary {
  cursor: pointer;
  font-weight: 700;
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
details.settings summary::-webkit-details-marker { display: none; }
details.settings summary::after { content: "▾"; color: var(--muted); }
details.settings[open] summary::after { content: "▴"; }
.setting { margin-top: 18px; }

/* ---------- Kopfzeile im Spiel ---------- */

.hud {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  color: var(--muted);
  font-size: .88rem;
}
.hud strong { color: var(--text); }

.scorebar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.score-pill {
  display: flex;
  align-items: center;
  gap: 7px;
  background: rgba(255,255,255,.05);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 12px 5px 5px;
  font-size: .86rem;
  font-weight: 600;
}
.score-pill .avatar { width: 26px; height: 26px; flex-basis: 26px; font-size: .8rem; }
.score-pill.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(255,206,58,.25);
}
.score-pill.out { opacity: .35; text-decoration: line-through; }
.score-pill .lives { letter-spacing: 1px; }

/* ---------- Frage ---------- */

.turn-card { text-align: center; padding: 42px 22px; }
.turn-card .avatar { width: 74px; height: 74px; flex-basis: 74px; font-size: 2rem; margin: 0 auto 14px; }
.turn-card h2 { font-size: clamp(1.6rem, 5vw, 2.4rem); }

.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 14px;
}
.tag {
  border-radius: 999px;
  padding: 5px 12px;
  font-size: .78rem;
  font-weight: 700;
  background: rgba(255,255,255,.08);
  border: 1px solid var(--border);
}
.tag.diff { color: var(--accent); }

.question {
  font-size: clamp(1.25rem, 3.6vw, 1.85rem);
  font-weight: 700;
  line-height: 1.35;
  margin: 6px 0 22px;
}

.answers { display: grid; gap: 10px; }
@media (min-width: 640px) { .answers { grid-template-columns: 1fr 1fr; } }

.answer {
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  width: 100%;
  background: rgba(255,255,255,.05);
  border: 1px solid var(--border);
  border-radius: 14px;
  color: var(--text);
  padding: 15px 16px;
  font-size: 1.02rem;
  font-weight: 600;
  cursor: pointer;
  transition: transform .1s ease, background .15s ease, border-color .15s ease;
}
.answer:hover:not(:disabled) { background: rgba(255,255,255,.12); transform: translateY(-2px); }
.answer:disabled { cursor: default; }
.answer .key {
  flex: 0 0 30px;
  height: 30px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  background: rgba(255,255,255,.1);
  font-weight: 800;
  font-size: .9rem;
}
.answer.correct {
  background: rgba(47, 214, 122, .22);
  border-color: var(--good);
}
.answer.correct .key { background: var(--good); color: #04220f; }
.answer.wrong {
  background: rgba(255, 77, 94, .2);
  border-color: var(--bad);
}
.answer.wrong .key { background: var(--bad); color: #2b0206; }
.answer.dim { opacity: .45; }

/* ---------- Timer ---------- */

.timer {
  height: 10px;
  border-radius: 999px;
  background: rgba(255,255,255,.09);
  overflow: hidden;
  margin-bottom: 16px;
}
.timer > div {
  height: 100%;
  width: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--good), var(--accent));
  transition: width .12s linear, background .3s ease;
}
.timer.low > div { background: linear-gradient(90deg, var(--accent-2), var(--bad)); }

/* ---------- Ergebnis / Rauswurf ---------- */

.verdict {
  text-align: center;
  font-size: clamp(1.3rem, 4.5vw, 2rem);
  font-weight: 800;
  margin: 18px 0 6px;
}
.verdict.good { color: var(--good); }
.verdict.bad  { color: var(--bad); }
.verdict-sub { text-align: center; color: var(--muted); margin-bottom: 18px; }

.boom {
  text-align: center;
  padding: 40px 20px;
  animation: pop .45s cubic-bezier(.2, 1.4, .4, 1);
}
.boom .emoji { font-size: 4rem; display: block; margin-bottom: 10px; }
.boom h2 { font-size: clamp(1.7rem, 6vw, 2.8rem); color: var(--bad); }

@keyframes pop {
  from { transform: scale(.7); opacity: 0; }
  to   { transform: scale(1);  opacity: 1; }
}
.fade { animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Tabellen / Endstand ---------- */

table.standings {
  width: 100%;
  border-collapse: collapse;
  font-size: .95rem;
}
table.standings th,
table.standings td {
  text-align: left;
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
}
table.standings th { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; }
table.standings td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.standings td .avatar {
  display: inline-grid;
  width: 26px; height: 26px;
  font-size: .8rem;
  vertical-align: -8px;
  margin-right: 6px;
}
table.standings tr.out td { opacity: .5; }

.winner {
  text-align: center;
  padding: 34px 20px;
}
.winner .crown { font-size: 3.6rem; display: block; }
.winner h2 { font-size: clamp(1.8rem, 6vw, 2.8rem); color: var(--accent); }
.winner .loser { color: var(--muted); margin-top: 14px; }
.winner .loser b { color: var(--bad); }

.row { display: flex; flex-wrap: wrap; gap: 10px; }
.row .btn { flex: 1 1 180px; }

.footer-note {
  text-align: center;
  color: var(--muted);
  font-size: .8rem;
  margin-top: 26px;
}
kbd {
  background: rgba(255,255,255,.1);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1px 6px;
  font-size: .8em;
  font-family: inherit;
}
.hidden { display: none !important; }

/* Avatar innerhalb eines Tags etwas kleiner */
.tag .avatar {
  width: 20px; height: 20px; flex-basis: 20px;
  font-size: .7rem;
  display: inline-grid;
  vertical-align: -5px;
}

/* Ja/Nein-Fragen: nur zwei, dafür große Knöpfe */
.answers.zwei .answer {
  justify-content: center;
  font-size: 1.2rem;
  padding: 24px 16px;
}
.answers.zwei .answer .key { display: none; }

/* ---------- Abstimmung ---------- */

.votes { display: grid; gap: 10px; }

.vote {
  display: grid;
  gap: 4px;
  text-align: left;
  width: 100%;
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--border);
  border-left: 4px solid var(--accent-2);
  border-radius: 14px;
  color: var(--text);
  padding: 14px 16px;
  cursor: pointer;
  font-family: inherit;
  transition: transform .1s ease, background .15s ease;
}
.vote:hover:not(:disabled) { background: rgba(255, 255, 255, .12); transform: translateY(-2px); }
.vote:disabled { cursor: default; opacity: .45; border-left-color: var(--border); }

.vote-antwort { font-size: 1.1rem; font-weight: 700; }
.vote-meta    { font-size: .85rem; color: var(--muted); }
.vote-flag    { font-size: .78rem; color: var(--muted); }
.vote-flag.good { color: var(--good); }
.vote-flag.bad  { color: var(--bad); }

.tally { display: grid; gap: 10px; margin: 18px 0 6px; }
.tally-row {
  display: grid;
  grid-template-columns: minmax(90px, 1fr) 3fr auto;
  align-items: center;
  gap: 10px;
}
.tally-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tally-bar {
  height: 14px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .08);
  overflow: hidden;
}
.tally-bar i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent-2), var(--accent));
  transition: width .4s ease;
}
.tally-zahl { font-weight: 800; font-variant-numeric: tabular-nums; min-width: 1.5em; text-align: right; }

/* Avatare in Fließtext-Zeilen der Abstimmung */
.vote-meta .avatar {
  display: inline-grid;
  width: 20px; height: 20px; flex-basis: 20px;
  font-size: .7rem;
  vertical-align: -5px;
  margin-right: 4px;
}

/* Avatar neben dem Namen in der Stimmenauswertung */
.tally-name .avatar {
  display: inline-grid;
  width: 24px; height: 24px; flex-basis: 24px;
  font-size: .78rem;
  vertical-align: -6px;
  margin-right: 5px;
}

/* Leben verloren – wie der Rauswurf, aber weniger endgültig */
.boom.warn h2 { color: var(--accent); }
.lives-big {
  font-size: 1.8rem;
  letter-spacing: 4px;
  margin: 6px 0 2px;
}

/* ---------- Moderatoransicht ---------- */

.loesung {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
  background: rgba(47, 214, 122, .12);
  border: 1px solid rgba(47, 214, 122, .4);
  border-radius: 14px;
  padding: 12px 16px;
  margin-bottom: 14px;
}
.loesung-label {
  font-size: .72rem;
  text-transform: uppercase;
  letter-spacing: .14em;
  color: var(--good);
  font-weight: 700;
}
.loesung-text { font-size: 1.25rem; font-weight: 700; }

.antwort-feld {
  width: 100%;
  margin: 14px 0 12px;
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-family: inherit;
  font-size: 1rem;
  padding: 13px 15px;
}
.antwort-feld::placeholder { color: var(--muted); }
.antwort-feld:focus {
  outline: none;
  border-color: var(--accent);
  background: rgba(255, 255, 255, .08);
}

.judge { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.judge .btn { padding: 18px 10px; font-size: 1.1rem; }
.btn.good {
  background: linear-gradient(100deg, var(--good), #17b862);
  color: #04220f;
  box-shadow: 0 10px 24px rgba(47, 214, 122, .22);
}
.btn.bad {
  background: linear-gradient(100deg, var(--bad), #d92b3c);
  color: #2b0206;
  box-shadow: 0 10px 24px rgba(255, 77, 94, .22);
}

/* Bedenkzeit läuft in der Moderatoransicht erst auf Knopfdruck */
.timer.idle { opacity: .3; }

/* Vierte Schwierigkeitsstufe */
.tag.diff.ultra {
  color: var(--accent-2);
  background: rgba(255, 77, 141, .16);
  border-color: rgba(255, 77, 141, .45);
}

/* Nebenknöpfe unter Frage und Auflösung */
.nebenknoepfe {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-top: 14px;
}
.nebenknoepfe .btn {
  flex: 0 1 auto;
  color: var(--muted);
}
.nebenknoepfe .btn:hover:not(:disabled) { color: var(--text); }
.nebenknoepfe .btn:disabled { opacity: .5; cursor: default; }

.verdict-sub em { color: var(--accent); font-style: normal; }

textarea.antwort-feld {
  font-size: .85rem;
  line-height: 1.5;
}

/* Handicap-Knopf in der Spielerliste */
.handicap {
  flex: 0 0 32px;
  height: 32px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, .05);
  color: var(--muted);
  font-family: inherit;
  font-size: .95rem;
  font-weight: 800;
  cursor: pointer;
  transition: all .12s ease;
}
.handicap:hover { background: rgba(255, 255, 255, .12); color: var(--text); }
.handicap.aktiv { color: var(--accent); border-color: var(--accent); }

.score-pill .hc { color: var(--accent); font-weight: 800; margin-left: 3px; }

/* Angefangenes Spiel fortsetzen */
.card.fortsetzen {
  display: grid;
  gap: 14px;
  border-color: var(--accent);
  box-shadow: 0 0 0 1px rgba(255, 206, 58, .25), var(--shadow);
}
.card.fortsetzen .hint { margin-top: 4px; }

</style>

</head>
<body>
<main class="wrap" id="app"></main>

<script>
/*
 * Fragenkatalog für "Der Dümmste fliegt"
 * ---------------------------------------
 * q(kategorie, schwierigkeit, frage, richtigeAntwort, ...falscheAntworten)
 * schwierigkeit: 1 = leicht, 2 = mittel, 3 = schwer
 * Die Antworten werden im Spiel zufällig gemischt.
 */
const q = (k, s, f, r, ...w) => ({ k, s, f, r, w });

window.FRAGEN = [

  /* ---------------- Allgemeinwissen ---------------- */
  q("Allgemeinwissen", 1, "Wie viele Farben hat ein Regenbogen klassischerweise?", "7", "5", "6", "9"),
  q("Allgemeinwissen", 1, "Welche Farbe entsteht, wenn man Blau und Gelb mischt?", "Grün", "Orange", "Lila", "Braun"),
  q("Allgemeinwissen", 1, "Wie viele Buchstaben hat das deutsche Alphabet ohne Umlaute und ß?", "26", "24", "28", "30"),
  q("Allgemeinwissen", 1, "Wie viele Sekunden hat eine Stunde?", "3.600", "360", "6.000", "1.800"),
  q("Allgemeinwissen", 1, "Welches Verkehrsschild ist achteckig?", "Das Stoppschild", "Vorfahrt achten", "Halteverbot", "Einbahnstraße"),
  q("Allgemeinwissen", 1, "Wie viele Bundesländer hat Deutschland?", "16", "14", "17", "12"),
  q("Allgemeinwissen", 1, "Welche Währung gilt in der Schweiz?", "Schweizer Franken", "Euro", "Krone", "Schilling"),
  q("Allgemeinwissen", 1, "Wie viele Karten hat ein deutsches Skatblatt?", "32", "52", "36", "24"),
  q("Allgemeinwissen", 1, "Wie viele Ecken hat ein Würfel?", "8", "6", "12", "4"),
  q("Allgemeinwissen", 1, "Wie viele Nullen hat eine Million?", "6", "3", "9", "12"),
  q("Allgemeinwissen", 1, "Wie viele Grad hat ein voller Kreis?", "360", "180", "270", "400"),
  q("Allgemeinwissen", 1, "Wie viele Felder hat ein Schachbrett?", "64", "48", "81", "100"),
  q("Allgemeinwissen", 2, "Wie viele Bit sind ein Byte?", "8", "4", "16", "10"),
  q("Allgemeinwissen", 2, "Was misst ein Barometer?", "Den Luftdruck", "Die Temperatur", "Die Luftfeuchtigkeit", "Die Windstärke"),
  q("Allgemeinwissen", 2, "Welche römische Zahl steht für 50?", "L", "C", "D", "X"),
  q("Allgemeinwissen", 2, "Wie viele Streifen hat die Flagge der USA?", "13", "50", "12", "15"),
  q("Allgemeinwissen", 2, "Wofür steht die Abkürzung „WLAN“?", "Wireless Local Area Network", "Wide Line Access Network", "Wireless Link And Net", "Web Local Access Node"),
  q("Allgemeinwissen", 2, "Welche Blutgruppe gilt als Universalspender?", "0 negativ", "AB positiv", "A positiv", "B negativ"),
  q("Allgemeinwissen", 2, "Wie viele Zähne hat ein erwachsener Mensch normalerweise?", "32", "28", "30", "36"),
  q("Allgemeinwissen", 2, "Wie viele Grad hat ein rechter Winkel?", "90", "45", "180", "120"),
  q("Allgemeinwissen", 2, "Was bedeutet „ASAP“?", "As soon as possible", "Always send a photo", "As said and posted", "After school, after practice"),
  q("Allgemeinwissen", 2, "Wie viele Sekunden hat ein Tag?", "86.400", "36.000", "144.000", "60.000"),
  q("Allgemeinwissen", 2, "Was bedeutet die Abkürzung „GmbH“?", "Gesellschaft mit beschränkter Haftung", "Gemeinschaft mit betrieblicher Haftung", "Gesellschaft mit betrieblichem Handel", "Genossenschaft mit begrenzter Haftung"),

<script>
/* =========================================================
   Der Dümmste fliegt – Spiellogik
   ========================================================= */
(function () {
  'use strict';

  const AVATAR_COLORS = [
    '#ffce3a', '#ff4d8d', '#4ad6ff', '#2fd67a', '#c08bff',
    '#ff9a3d', '#7ef2c9', '#ff6b6b', '#8ea2ff', '#ffd9a0'
  ];
  const KEYS = ['A', 'B', 'C', 'D'];
  const STUFEN = ['', 'Leicht', 'Mittel', 'Schwer', 'Ultra'];
  const sterne = s => '★'.repeat(s) + '☆'.repeat(4 - s);
  const HANDICAP_ZEICHEN = { '-1': '▼', '0': '=', '1': '▲' };
  const SPEICHER = 'ddf-setup-v1';
  const GEDAECHTNIS = 'ddf-gestellt-v1';
  const MELDUNGEN = 'ddf-gemeldet-v1';
  const SPIELSTAND = 'ddf-spielstand-v1';

  const app = document.getElementById('app');
  const alleKategorien = [...new Set(window.FRAGEN.map(f => f.k))];

  /* ---------------------------------------------------------
     Zustand
     --------------------------------------------------------- */
  const S = {
    screen: 'setup',
    einstellungen: {
      modus: 'runde',          // 'runde' | 'leben' | 'voting'
      leben: 3,
      zeit: 20,                // Sekunden, 0 = ohne Zeitlimit
      fragenProRunde: 2,
      abstimmungNach: 2,       // Runden bis zur Abstimmung (Abstimmungsmodus)
      schwierigkeit: 'auto',   // 'auto' | 1 | 2 | 3 | 'mix'
      kategorien: alleKategorien.slice(),
      jaNein: true,            // Ja/Nein-Fragen mitspielen?
      sound: true,
      uebergabe: true,         // Zwischenbildschirm "XY ist dran"
      moderator: false,        // Ein Gerät beim Moderator, Fragen werden vorgelesen
      optionenZeigen: 'ultra'  // Antwortmöglichkeiten: 'nie' | 'ultra' | 'schwer' | 'immer'
    },
    namen: ['Spieler 1', 'Spieler 2', 'Spieler 3'],
    handicaps: [0, 0, 0],      // je Spieler: -1 leichter, 0 normal, +1 schwerer
    spieler: [],
    runde: 1,
    reihenfolge: [],
    rIndex: 0,
    rundenPunkte: {},
    stechen: null,             // { kandidaten:[id], ergebnisse:{id:bool}, reihe:[id], idx:0 }
    blockRunde: 1,             // Runden seit der letzten Abstimmung
    protokoll: [],             // gegebene Antworten seit der letzten Abstimmung
    abstimmung: null,          // { kandidaten, waehler, idx, stimmen }
    gestellt: new Set(),       // schon gestellte Fragen (auch über Spielabende hinweg)
    gemeldet: [],              // als fehlerhaft gemeldete Fragen
    rausFolge: [],
    pool: [],
    aktuell: null,
    timerId: null,
    restMs: 0,
    letzterTick: 0
  };

  /* ---------------------------------------------------------
     Hilfsfunktionen
     --------------------------------------------------------- */
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function mischen(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const lebende = () => S.spieler.filter(p => p.dabei);
  const spielerVon = id => S.spieler.find(p => p.id === id);

  function avatar(p, extra) {
    return `<span class="avatar${extra ? ' ' + extra : ''}" style="background:${p.farbe}">${esc(p.name.trim().charAt(0).toUpperCase() || '?')}</span>`;
  }

  /* ---------------------------------------------------------
     Sound (kleine Töne per WebAudio, keine Dateien nötig)
     --------------------------------------------------------- */
  const Sound = {
    ctx: null,
    an() { return S.einstellungen.sound; },
    hole() {
      if (!this.an()) return null;
      try {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          this.ctx = new AC();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      } catch (e) { return null; }
    },
    ton(freq, ab, dauer, form = 'sine', laut = 0.14) {
      const ctx = this.hole();
      if (!ctx) return;
      const t = ctx.currentTime + ab;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = form;
      osc.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(laut, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dauer);
      osc.connect(g).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + dauer + 0.05);
    },
    richtig() { this.ton(660, 0, 0.14); this.ton(990, 0.1, 0.25); },
    falsch()  { this.ton(200, 0, 0.2, 'sawtooth'); this.ton(120, 0.16, 0.35, 'sawtooth'); },
    raus()    { [520, 420, 330, 240].forEach((f, i) => this.ton(f, i * 0.13, 0.3, 'triangle')); },
    sieg()    { [523, 659, 784, 1047].forEach((f, i) => this.ton(f, i * 0.13, 0.4, 'triangle')); },
    tick()    { this.ton(880, 0, 0.06, 'square', 0.06); }
  };

  /* ---------------------------------------------------------
     Fragen-Pool
     --------------------------------------------------------- */
  function passendeFragen() {
    const e = S.einstellungen;
    let fragen = window.FRAGEN.filter(f => e.kategorien.includes(f.k) && !istGemeldet(f));
    if (!e.jaNein) fragen = fragen.filter(f => !f.jn);
    return fragen;
  }

  /* Kurzer, stabiler Schlüssel je Frage – Grundlage des Fragengedächtnisses */
  function fid(f) {
    let h = 5381;
    for (let i = 0; i < f.f.length; i++) h = ((h << 5) + h + f.f.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }

  function ladeGestellt() {
    try {
      const roh = localStorage.getItem(GEDAECHTNIS);
      S.gestellt = new Set(roh ? JSON.parse(roh) : []);
    } catch (e) { S.gestellt = new Set(); }
  }

  function speichereGestellt() {
    try { localStorage.setItem(GEDAECHTNIS, JSON.stringify([...S.gestellt])); } catch (e) { /* egal */ }
  }

  function ladeGemeldet() {
    try {
      const roh = localStorage.getItem(MELDUNGEN);
      S.gemeldet = roh ? JSON.parse(roh) : [];
    } catch (e) { S.gemeldet = []; }
    if (!Array.isArray(S.gemeldet)) S.gemeldet = [];
  }

  function speichereGemeldet() {
    try { localStorage.setItem(MELDUNGEN, JSON.stringify(S.gemeldet)); } catch (e) { /* egal */ }
  }

  const istGemeldet = f => S.gemeldet.some(x => x.f === f.f);

  function poolAufbauen() {
    let fragen = passendeFragen();
    if (!fragen.length) fragen = window.FRAGEN.slice();

    // Fragen, die auf diesem Gerät noch nie dran waren, haben Vorrang
    let frisch = fragen.filter(f => !S.gestellt.has(fid(f)));
    if (frisch.length < Math.min(25, fragen.length)) {
      // Der Vorrat ist fast durch – Gedächtnis leeren und von vorn
      S.gestellt = new Set();
      speichereGestellt();
      frisch = fragen;
    }
    S.pool = mischen(frisch);
  }

  function zielStufe(spieler) {
    const e = S.einstellungen;
    if (e.schwierigkeit === 'mix') return 0;

    let stufe;
    if (e.schwierigkeit !== 'auto') {
      stufe = Number(e.schwierigkeit);
    } else {
      // Automatisch: es wird von Runde zu Runde schwerer
      stufe = S.runde <= 2 ? 1 : S.runde <= 4 ? 2 : S.runde <= 6 ? 3 : 4;
    }

    // Handicap verschiebt die Stufe für einzelne Spieler
    if (spieler && spieler.handicap) stufe += spieler.handicap;
    return Math.min(4, Math.max(1, stufe));
  }

  function frageZiehen(spieler) {
    if (!S.pool.length) poolAufbauen();
    const stufe = zielStufe(spieler);
    let idx = 0;
    if (stufe) {
      idx = S.pool.findIndex(f => f.s === stufe);
      if (idx < 0) idx = S.pool.findIndex(f => Math.abs(f.s - stufe) === 1);
      if (idx < 0) idx = 0;
    }
    const frage = S.pool.splice(idx, 1)[0];
    S.gestellt.add(fid(frage));
    speichereGestellt();
    return {
      frage,
      antworten: frage.jn ? ['Ja', 'Nein'] : mischen([frage.r, ...frage.w])
    };
  }

  /* ---------------------------------------------------------
     Einstellungen speichern / laden
     --------------------------------------------------------- */
  function speichern() {
    try {
      localStorage.setItem(SPEICHER, JSON.stringify({
        namen: S.namen,
        handicaps: S.handicaps,
        einstellungen: S.einstellungen,
        bekannteKategorien: alleKategorien
      }));
    } catch (e) { /* egal */ }
  }

  function laden() {
    try {
      const roh = localStorage.getItem(SPEICHER);
      if (!roh) return;
      const d = JSON.parse(roh);
      if (Array.isArray(d.namen) && d.namen.length >= 2) S.namen = d.namen.slice(0, 10);
      S.handicaps = S.namen.map((_, i) => (Array.isArray(d.handicaps) ? d.handicaps[i] : 0) || 0);
      if (d.einstellungen) {
        Object.assign(S.einstellungen, d.einstellungen);
        S.einstellungen.kategorien = (S.einstellungen.kategorien || [])
          .filter(k => alleKategorien.includes(k));

        // Kategorien, die es beim letzten Spielabend noch nicht gab, sind automatisch dabei
        const bekannt = Array.isArray(d.bekannteKategorien) ? d.bekannteKategorien : [];
        alleKategorien.forEach(k => {
          if (!bekannt.includes(k) && !S.einstellungen.kategorien.includes(k)) {
            S.einstellungen.kategorien.push(k);
          }
        });

        if (!S.einstellungen.kategorien.length) S.einstellungen.kategorien = alleKategorien.slice();
      }
    } catch (e) { /* egal */ }
  }

  /* ---------------------------------------------------------
     Bildschirm: Einrichtung
     --------------------------------------------------------- */
  function zeigeSetup() {
    S.screen = 'setup';
    const e = S.einstellungen;
    const zahlChips = [];
    for (let n = 2; n <= 10; n++) {
      zahlChips.push(`<button class="chip num" data-anzahl="${n}" aria-pressed="${S.namen.length === n}">${n}</button>`);
    }

    app.innerHTML = `
      <div class="logo">
        <div class="kicker">Das Quiz-Partyspiel</div>
        <h1>Der Dümmste fliegt</h1>
        <p>${window.FRAGEN.length.toLocaleString('de-DE')} Fragen · 2–10 Spieler · ein Gerät reicht</p>
      </div>

      ${(() => {
        const d = spielstandLesen();
        if (!d) return '';
        const dabei = d.spieler.filter(x => x.dabei);
        return `
          <div class="card fortsetzen">
            <div>
              <strong>Angefangenes Spiel</strong>
              <p class="hint">Runde ${d.runde} · ${dabei.length} von ${d.spieler.length} Spielern übrig ·
                ${esc(vorWieLange(d.zeit))}<br>${esc(dabei.map(x => x.name).join(', '))}</p>
            </div>
            <div class="row">
              <button class="btn" id="fortsetzen">Spiel fortsetzen</button>
              <button class="btn ghost" id="verwerfen">Verwerfen</button>
            </div>
          </div>`;
      })()}

      <div class="card">
        <span class="label">Wie viele spielen mit?</span>
        <div class="chips">${zahlChips.join('')}</div>
      </div>

      <div class="card">
        <span class="label">Namen</span>
        <div class="players">
          ${S.namen.map((n, i) => `
            <div class="player-row">
              <span class="avatar" style="background:${AVATAR_COLORS[i % AVATAR_COLORS.length]}">${esc((n.trim()[0] || String(i + 1)).toUpperCase())}</span>
              <input type="text" data-name="${i}" value="${esc(n)}" maxlength="14" placeholder="Spieler ${i + 1}">

            </div>`).join('')}
        </div>

          Der Knopf hinter dem Namen setzt ein Handicap: <b>=</b> normal,

      </div>

      <div class="card">
        <details class="settings" ${S.setupOffen ? 'open' : ''}>
          <summary>Spieleinstellungen</summary>

          <div class="setting">
            <span class="label">Spielmodus</span>

            </div>
          </div>

          <div class="setting" id="abstimmungSetting">
            <span class="label">Runden bis zur Abstimmung</span>
            <div class="chips">
              ${[1, 2, 3, 4].map(n => `<button class="chip num" data-set="abstimmungNach" data-wert="${n}" aria-pressed="${e.abstimmungNach === n}">${n}</button>`).join('')}

          </div>

          <div class="setting" id="lebenSetting">
            <span class="label" id="lebenLabel">Leben pro Spieler</span>

              ${[1, 2, 3, 4, 5].map(n => `<button class="chip num" data-set="leben" data-wert="${n}" aria-pressed="${e.leben === n}">${'❤'.repeat(n)}</button>`).join('')}

              ${[10, 15, 20, 30, 45, 0].map(n => `<button class="chip num" data-set="zeit" data-wert="${n}" aria-pressed="${e.zeit === n}">${n ? n + ' s' : 'ohne'}</button>`).join('')}

          <div class="setting">
            <span class="label">Wie spielt ihr?</span>

              <button class="chip" data-toggle="moderator" aria-pressed="${e.moderator}">🎤 Moderatoransicht</button>

            <span class="label">Antwortmöglichkeiten vorlesen</span>

              <button class="chip" data-set="optionenZeigen" data-wert="ultra" aria-pressed="${e.optionenZeigen === 'ultra'}">Nur bei ★★★★ Ultra</button>
              <button class="chip" data-set="optionenZeigen" data-wert="schwer" aria-pressed="${e.optionenZeigen === 'schwer'}">Ab „schwer“</button>
              <button class="chip" data-set="optionenZeigen" data-wert="immer" aria-pressed="${e.optionenZeigen === 'immer'}">Immer</button>
            </div>
            <p class="hint">Sonst blendest du sie bei jeder Frage einzeln ein.</p>
          </div>

          <div class="setting">
            <span class="label">Fragengedächtnis</span>
            <p class="hint" id="gedaechtnisHinweis" style="margin-bottom:8px"></p>
            <button class="chip" id="gedaechtnisReset">Gedächtnis zurücksetzen</button>
          </div>

          <div class="setting" id="meldungenSetting">
            <span class="label">Gemeldete Fragen</span>
            <p class="hint" id="meldungenHinweis" style="margin-bottom:8px"></p>
            <textarea class="antwort-feld" id="meldungenText" rows="5" readonly
                      style="margin:0 0 10px; resize:vertical"></textarea>
            <div class="chips">
              <button class="chip" id="meldungenKopieren">Liste kopieren</button>
              <button class="chip" id="meldungenLeeren">Meldungen löschen</button>
            </div>
          </div>

          <div class="setting">
            <span class="label">Sonstiges</span>
            <div class="chips">
              <button class="chip" data-toggle="jaNein" aria-pressed="${e.jaNein}">❓ Ja/Nein-Fragen</button>
              <button class="chip" data-toggle="sound" aria-pressed="${e.sound}">🔊 Sound</button>
              <button class="chip" id="uebergabeChip" data-toggle="uebergabe" aria-pressed="${e.uebergabe}">🔁 „Du bist dran“-Bildschirm</button>
            </div>
          </div>
        </details>
      </div>

      <button class="btn block" id="start">Spiel starten</button>
      <p class="footer-note">Antworten per Klick oder mit den Tasten <kbd>1</kbd>–<kbd>4</kbd> bzw. <kbd>A</kbd>–<kbd>D</kbd>, weiter mit <kbd>Leertaste</kbd>.</p>
    `;

    aktualisiereSetupHinweise();

    const fort = app.querySelector('#fortsetzen');
    if (fort) fort.addEventListener('click', spielFortsetzen);
    const verw = app.querySelector('#verwerfen');
    if (verw) verw.addEventListener('click', () => { spielstandVerwerfen(); zeigeSetup(); });

    app.querySelectorAll('[data-anzahl]').forEach(b => b.addEventListener('click', () => {
      const n = Number(b.dataset.anzahl);
      const alt = S.namen.slice();
      const altH = S.handicaps.slice();
      S.namen = [];
      S.handicaps = [];
      for (let i = 0; i < n; i++) {
        S.namen.push(alt[i] || 'Spieler ' + (i + 1));
        S.handicaps.push(altH[i] || 0);
      }
      S.setupOffen = app.querySelector('details.settings').open;
      speichern();
      zeigeSetup();
    }));

    app.querySelectorAll('[data-handicap]').forEach(b => b.addEventListener('click', () => {
      const i = Number(b.dataset.handicap);
      const jetzt = S.handicaps[i] || 0;
      S.handicaps[i] = jetzt === 0 ? 1 : jetzt === 1 ? -1 : 0;
      b.textContent = HANDICAP_ZEICHEN[S.handicaps[i]];
      b.classList.toggle('aktiv', S.handicaps[i] !== 0);
      speichern();
    }));

    app.querySelectorAll('[data-name]').forEach(inp => {
      inp.addEventListener('input', () => {
        S.namen[Number(inp.dataset.name)] = inp.value;
        const av = inp.previousElementSibling;
        av.textContent = (inp.value.trim()[0] || String(Number(inp.dataset.name) + 1)).toUpperCase();
        speichern();
      });
    });

    app.querySelectorAll('[data-set]').forEach(b => b.addEventListener('click', () => {
      const feld = b.dataset.set;
      let wert = b.dataset.wert;
      if (['leben', 'zeit', 'fragenProRunde', 'abstimmungNach'].includes(feld)) wert = Number(wert);
      S.einstellungen[feld] = wert;
      b.parentElement.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
      aktualisiereSetupHinweise();
      speichern();
    }));

    app.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', () => {
      const feld = b.dataset.toggle;
      S.einstellungen[feld] = !S.einstellungen[feld];
      b.setAttribute('aria-pressed', S.einstellungen[feld]);
      if (feld === 'sound' && S.einstellungen[feld]) Sound.richtig();
      aktualisiereSetupHinweise();
      speichern();
    }));

    app.querySelectorAll('[data-kat]').forEach(b => b.addEventListener('click', () => {
      const k = b.dataset.kat;
      const liste = S.einstellungen.kategorien;
      const i = liste.indexOf(k);
      if (i >= 0) { if (liste.length > 1) liste.splice(i, 1); }
      else liste.push(k);
      b.setAttribute('aria-pressed', liste.includes(k));
      aktualisiereSetupHinweise();
      speichern();
    }));

    app.querySelector('#meldungenKopieren').addEventListener('click', () => {
      const feld = app.querySelector('#meldungenText');
      const knopf = app.querySelector('#meldungenKopieren');
      feld.select();
      const fertig = () => { knopf.textContent = 'Kopiert ✓'; setTimeout(() => knopf.textContent = 'Liste kopieren', 1800); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(feld.value).then(fertig, () => {
          knopf.textContent = 'Text ist markiert – mit Strg+C kopieren';
        });
      } else {
        knopf.textContent = 'Text ist markiert – mit Strg+C kopieren';
      }
    });

    app.querySelector('#meldungenLeeren').addEventListener('click', () => {
      S.gemeldet = [];
      speichereGemeldet();
      aktualisiereSetupHinweise();
    });

    app.querySelector('#gedaechtnisReset').addEventListener('click', () => {
      S.gestellt = new Set();
      speichereGestellt();
      aktualisiereSetupHinweise();
    });

    app.querySelector('#start').addEventListener('click', spielStarten);
  }

  function aktualisiereSetupHinweise() {
    const e = S.einstellungen;
    const rund = app.querySelector('#rundenSetting');
    const leb = app.querySelector('#lebenSetting');
    const abst = app.querySelector('#abstimmungSetting');
    const hin = app.querySelector('#modusHinweis');
    const kat = app.querySelector('#katHinweis');
    const ged = app.querySelector('#gedaechtnisHinweis');
    if (rund) rund.classList.toggle('hidden', e.modus === 'leben');
    if (leb) leb.classList.toggle('hidden', e.modus === 'runde');
    if (abst) abst.classList.toggle('hidden', e.modus !== 'voting');
    if (hin) {
      hin.textContent = {
        runde: 'Jede Runde beantworten alle die gleiche Anzahl Fragen. Wer am Ende der Runde die wenigsten richtig hat, fliegt raus – bei Gleichstand gibt es ein Stechen.',
        leben: 'Reihum eine Frage. Jede falsche Antwort kostet ein Leben. Wer keine Leben mehr hat, fliegt raus.',
        voting: 'Erst wird gespielt, dann gerichtet: Nach den eingestellten Runden stimmen alle ab, welche Antwort die dümmste war. Wer die meisten Stimmen bekommt, verliert ein Leben – wer keins mehr hat, fliegt raus. Bei Gleichstand entscheidet ein Stechen.'
      }[e.modus];
    }
    const modAn = e.moderator;
    const optSet = app.querySelector('#optionenSetting');
    const modHin = app.querySelector('#moderatorHinweis');
    const ueberChip = app.querySelector('#uebergabeChip');
    if (optSet) optSet.classList.toggle('hidden', !modAn);
    if (ueberChip) ueberChip.classList.toggle('hidden', modAn);
    if (modHin) {
      modHin.textContent = modAn
        ? 'Einer liest die Fragen vor und wertet: Die Frage erscheint offen, die Lösung steht klein darunter, und du tippst nur noch auf Richtig oder Falsch. Antwortmöglichkeiten kannst du bei Bedarf einblenden.'
        : 'Alle spielen an einem Gerät und geben es reihum weiter. Jede Frage hat vier Antworten zum Antippen.';
    }
    const lebLabel = app.querySelector('#lebenLabel');
    if (lebLabel) {
      lebLabel.textContent = e.modus === 'voting'
        ? 'Leben pro Spieler (1 = sofort raus)'
        : 'Leben pro Spieler';
    }
    const meldSet = app.querySelector('#meldungenSetting');
    if (meldSet) {
      const anzahl = S.gemeldet.length;
      meldSet.classList.toggle('hidden', anzahl === 0);
      if (anzahl) {
        app.querySelector('#meldungenHinweis').textContent =
          `${anzahl} ${anzahl === 1 ? 'Frage wurde' : 'Fragen wurden'} als fehlerhaft gemeldet und kommen nicht mehr dran. Liste kopieren und weitergeben, dann lassen sie sich korrigieren.`;
        app.querySelector('#meldungenText').value =
          'Gemeldete Fragen aus „Der Dümmste fliegt“:\n' +
          S.gemeldet.map((x, i) =>
            `${i + 1}. [${x.k} · Stufe ${x.s}] ${x.f} → hinterlegte Antwort: ${x.r}`
          ).join('\n');
      }
    }

    if (ged) {
      const gesamt = window.FRAGEN.length;
      ged.textContent = S.gestellt.size
        ? `${S.gestellt.size} von ${gesamt} Fragen waren auf diesem Gerät schon dran – sie kommen erst wieder, wenn der Rest durch ist.`
        : `Noch keine Frage gestellt. Gespielte Fragen werden gemerkt, damit sich beim nächsten Mal nichts wiederholt.`;
    }
    if (kat) {
      const fragen = passendeFragen();
      const jaNein = fragen.filter(f => f.jn).length;
      kat.textContent = fragen.length + ' Fragen ausgewählt'
        + (jaNein ? ` (davon ${jaNein} Ja/Nein-Fragen)` : '') + '.';
    }
  }

  /* ---------------------------------------------------------
     Spielstand: überlebt zugeklappte Tabs und leere Akkus
     --------------------------------------------------------- */
  function spielSichern() {
    try {
      localStorage.setItem(SPIELSTAND, JSON.stringify({
        zeit: Date.now(),
        einstellungen: S.einstellungen,
        namen: S.namen,
        handicaps: S.handicaps,
        spieler: S.spieler,
        runde: S.runde,
        reihenfolge: S.reihenfolge,
        rIndex: S.rIndex,
        rundenPunkte: S.rundenPunkte,
        stechen: S.stechen,
        blockRunde: S.blockRunde,
        protokoll: S.protokoll,
        abstimmung: S.abstimmung,
        rausFolge: S.rausFolge
      }));
    } catch (e) { /* egal */ }
  }

  function spielstandLesen() {
    try {
      const roh = localStorage.getItem(SPIELSTAND);
      const d = roh ? JSON.parse(roh) : null;
      if (!d || !Array.isArray(d.spieler) || d.spieler.filter(p => p.dabei).length < 2) return null;
      return d;
    } catch (e) { return null; }
  }

  function spielstandVerwerfen() {
    try { localStorage.removeItem(SPIELSTAND); } catch (e) { /* egal */ }
  }

  function spielFortsetzen() {
    const d = spielstandLesen();
    if (!d) return;
    Sound.hole();
    Object.assign(S.einstellungen, d.einstellungen || {});
    S.namen = d.namen || S.namen;
    S.handicaps = d.handicaps || S.handicaps;
    S.spieler = d.spieler;
    S.runde = d.runde || 1;
    S.reihenfolge = d.reihenfolge || [];
    S.rIndex = d.rIndex || 0;
    S.rundenPunkte = d.rundenPunkte || {};
    S.stechen = d.stechen || null;
    S.blockRunde = d.blockRunde || 1;
    S.protokoll = d.protokoll || [];
    S.abstimmung = d.abstimmung || null;
    S.rausFolge = d.rausFolge || [];
    poolAufbauen();
    if (S.abstimmung) abstimmungZug();
    else naechsterZug();
  }

  function vorWieLange(zeit) {
    const min = Math.round((Date.now() - zeit) / 60000);
    if (min < 1) return 'gerade eben';
    if (min < 60) return `vor ${min} Minute${min === 1 ? '' : 'n'}`;
    const std = Math.round(min / 60);
    if (std < 24) return `vor ${std} Stunde${std === 1 ? '' : 'n'}`;
    const tage = Math.round(std / 24);
    return `vor ${tage} Tag${tage === 1 ? '' : 'en'}`;
  }

  /* ---------------------------------------------------------
     Spielstart
     --------------------------------------------------------- */
  function spielStarten() {
    Sound.hole();
    S.spieler = S.namen.map((n, i) => ({
      id: i,
      name: (n || '').trim() || 'Spieler ' + (i + 1),
      farbe: AVATAR_COLORS[i % AVATAR_COLORS.length],
      leben: S.einstellungen.leben,
      handicap: S.handicaps[i] || 0,
      dabei: true,
      richtig: 0,
      falsch: 0,
      zeit: 0
    }));
    S.runde = 1;
    S.rausFolge = [];
    S.stechen = null;
    blockZuruecksetzen();
    poolAufbauen();
    rundeAufbauen();
    naechsterZug();
  }

  function blockZuruecksetzen() {
    S.blockRunde = 1;
    S.protokoll = [];
    S.abstimmung = null;
  }

  function rundeAufbauen() {
    const aktive = lebende().map(p => p.id);
    S.rundenPunkte = {};
    aktive.forEach(id => S.rundenPunkte[id] = 0);
    const reihe = [];
    const durchgaenge = S.einstellungen.modus === 'leben' ? 1 : S.einstellungen.fragenProRunde;
    for (let d = 0; d < durchgaenge; d++) reihe.push(...aktive);
    S.reihenfolge = reihe;
    S.rIndex = 0;
  }

  /* ---------------------------------------------------------
     Zugsteuerung
     --------------------------------------------------------- */
  function naechsterZug() {
    spielSichern();
    if (S.stechen) return stechenZug();
    if (S.rIndex >= S.reihenfolge.length) return rundeBeenden();

    const pid = S.reihenfolge[S.rIndex];
    const p = spielerVon(pid);
    if (!p.dabei) { S.rIndex++; return naechsterZug(); }

    S.aktuell = Object.assign(frageZiehen(p), { pid, gewaehlt: null, start: Date.now() });

    if (uebergabeNoetig()) zeigeUebergabe(p);
    else zeigeFrage();
  }

  /* Beim Moderator wandert das Gerät nicht – der Zwischenbildschirm entfällt */
  function uebergabeNoetig() {
    return S.einstellungen.uebergabe && !S.einstellungen.moderator;
  }

  function stechenZug() {
    const st = S.stechen;
    if (st.idx >= st.reihe.length) return stechenAuswerten();
    const pid = st.reihe[st.idx];
    S.aktuell = Object.assign(frageZiehen(spielerVon(pid)), { pid, gewaehlt: null, start: Date.now(), stechen: true });
    if (uebergabeNoetig()) zeigeUebergabe(spielerVon(pid), 'Stechfrage!');
    else zeigeFrage();
  }

  function zeigeUebergabe(p, titel, weiter) {
    S.screen = 'uebergabe';
    app.innerHTML = kopf() + `
      <div class="card turn-card fade">
        ${titel ? `<div class="tag diff">${esc(titel)}</div>` : ''}
        ${avatar(p)}
        <h2>${esc(p.name)} ist dran</h2>
        <p class="hint">Gerät weitergeben – dann geht's los.</p>
        <br>
        <button class="btn" id="weiter">Bereit!</button>
      </div>`;
    app.querySelector('#weiter').addEventListener('click', weiter || zeigeFrage);
  }

  /* ---------------------------------------------------------
     Frage anzeigen
     --------------------------------------------------------- */
  function zeigeFrage() {
    if (S.einstellungen.moderator) return zeigeFrageModerator();
    S.screen = 'frage';
    const a = S.aktuell;
    const p = spielerVon(a.pid);
    const stufe = STUFEN[a.frage.s];
    a.start = Date.now();

    app.innerHTML = kopf() + `
      <div class="card fade">
        ${S.einstellungen.zeit ? '<div class="timer" id="timer"><div></div></div>' : ''}
        <div class="meta">
          <span class="tag">${esc(a.frage.k)}</span>
          <span class="tag diff${a.frage.s === 4 ? ' ultra' : ''}">${sterne(a.frage.s)} ${stufe}</span>
          ${a.frage.jn ? '<span class="tag">Ja oder Nein?</span>' : ''}
          ${a.stechen ? '<span class="tag" style="background:rgba(255,77,141,.25)">Stechen</span>' : ''}
          <span class="tag">${avatar(p, 'inline')} ${esc(p.name)}</span>
        </div>
        <div class="question">${esc(a.frage.f)}</div>
        <div class="answers${a.frage.jn ? ' zwei' : ''}" id="antworten">
          ${a.antworten.map((t, i) => `
            <button class="answer" data-i="${i}">
              <span class="key">${KEYS[i]}</span><span>${esc(t)}</span>
            </button>`).join('')}
        </div>
        <div class="nebenknoepfe">
          <button class="btn ghost small" id="ueberspringen">↷ Andere Frage</button>
        </div>
      </div>`;

    app.querySelectorAll('.answer').forEach(b =>
      b.addEventListener('click', () => antworten(Number(b.dataset.i))));
    app.querySelector('#ueberspringen').addEventListener('click', frageUeberspringen);

    starteTimer();
  }

  /* ---------------------------------------------------------
     Moderatoransicht: offene Frage, der Moderator wertet
     --------------------------------------------------------- */
  function zeigeFrageModerator() {
    S.screen = 'frage';
    const a = S.aktuell;
    const e = S.einstellungen;
    const p = spielerVon(a.pid);
    const stufe = STUFEN[a.frage.s];
    a.start = Date.now();

    if (a.optionenSichtbar === undefined) {
      a.optionenSichtbar = !a.frage.jn && (
        e.optionenZeigen === 'immer' ||
        (e.optionenZeigen === 'schwer' && a.frage.s >= 3) ||
        (e.optionenZeigen === 'ultra' && a.frage.s === 4)
      );
    }

    app.innerHTML = kopf() + `
      <div class="card fade">
        ${e.zeit ? `<div class="timer${a.zeitGestartet ? '' : ' idle'}" id="timer"><div></div></div>` : ''}
        <div class="meta">
          <span class="tag">${esc(a.frage.k)}</span>
          <span class="tag diff${a.frage.s === 4 ? ' ultra' : ''}">${sterne(a.frage.s)} ${stufe}</span>
          ${a.frage.jn ? '<span class="tag">Ja oder Nein?</span>' : ''}
          ${a.stechen ? '<span class="tag" style="background:rgba(255,77,141,.25)">Stechen</span>' : ''}
          <span class="tag">${avatar(p, 'inline')} ${esc(p.name)}</span>
        </div>

        <div class="question">${esc(a.frage.f)}</div>

        <div class="loesung">
          <span class="loesung-label">Lösung</span>
          <span class="loesung-text">${esc(a.frage.r)}</span>
        </div>

        ${a.optionenSichtbar
          ? `<p class="hint">Zum Vorlesen – ein Klick wertet direkt:</p>
             <div class="answers${a.frage.jn ? ' zwei' : ''}" id="antworten">
               ${a.antworten.map((t, i) => `
                 <button class="answer" data-i="${i}">
                   <span class="key">${KEYS[i]}</span><span>${esc(t)}</span>
                 </button>`).join('')}
             </div>`
          : `<button class="btn ghost block" id="optionen">Antwortmöglichkeiten einblenden</button>`}

        <input class="antwort-feld" id="gesagt" type="text" maxlength="60"
               placeholder="Was hat ${esc(p.name)} geantwortet? (optional)"
               autocomplete="off">

        <div class="judge">
          <button class="btn good" id="jaRichtig">✓ Richtig</button>
          <button class="btn bad" id="jaFalsch">✗ Falsch</button>
        </div>

        ${e.zeit && !a.zeitGestartet
          ? `<button class="btn ghost block" id="zeitStart" style="margin-top:10px">Bedenkzeit starten (${e.zeit} s)</button>`
          : ''}
        <div class="nebenknoepfe">
          <button class="btn ghost small" id="ueberspringen">↷ Andere Frage</button>
          <button class="btn ghost small" id="melden">⚑ Frage ist falsch</button>
        </div>
        <p class="hint">Tastatur: <kbd>R</kbd> richtig, <kbd>F</kbd> falsch${a.optionenSichtbar ? ', <kbd>1</kbd>–<kbd>4</kbd> für die Antwort' : ''}.</p>
      </div>`;

    const feld = app.querySelector('#gesagt');
    const gesagt = () => (feld && feld.value) || '';

    app.querySelectorAll('.answer').forEach(b => b.addEventListener('click', () => {
      const i = Number(b.dataset.i);
      const richtigIdx = a.antworten.indexOf(a.frage.r);
      wertung(i === richtigIdx, { gewaehlt: i, text: gesagt() || a.antworten[i] });
    }));

    const opt = app.querySelector('#optionen');
    if (opt) opt.addEventListener('click', () => {
      const lief = S.timerId !== null;
      const rest = S.restMs;
      const gemerkt = gesagt();
      stoppeTimer();
      a.optionenSichtbar = true;
      zeigeFrageModerator();
      const neu = app.querySelector('#gesagt');
      if (neu) neu.value = gemerkt;
      if (lief) starteTimer(rest);
    });

    app.querySelector('#jaRichtig').addEventListener('click', () => wertung(true, { text: gesagt() }));
    app.querySelector('#jaFalsch').addEventListener('click', () => wertung(false, { text: gesagt() }));

    app.querySelector('#ueberspringen').addEventListener('click', frageUeberspringen);
    app.querySelector('#melden').addEventListener('click', () => {
      frageMelden(a.frage);
      frageUeberspringen();
    });

    const zeit = app.querySelector('#zeitStart');
    if (zeit) zeit.addEventListener('click', () => {
      zeit.disabled = true;
      a.zeitGestartet = true;
      a.start = Date.now();
      const bar = app.querySelector('#timer');
      if (bar) bar.classList.remove('idle');
      starteTimer();
    });
  }

  /* Diese Frage passt nicht – neue für denselben Spieler ziehen */
  function frageUeberspringen() {
    if (S.screen !== 'frage') return;
    stoppeTimer();
    const alt = S.aktuell;
    S.aktuell = Object.assign(frageZiehen(spielerVon(alt.pid)), {
      pid: alt.pid,
      gewaehlt: null,
      start: Date.now(),
      stechen: alt.stechen
    });
    zeigeFrage();
  }

  /* Frage als fehlerhaft melden: kommt nie wieder und landet in der Liste */
  function frageMelden(frage) {
    if (!S.gemeldet.some(x => x.f === frage.f)) {
      S.gemeldet.push({ f: frage.f, k: frage.k, s: frage.s, r: frage.r });
      speichereGemeldet();
    }
  }

  function starteTimer(rest) {
    stoppeTimer();
    if (!S.einstellungen.zeit) return;
    const gesamt = S.einstellungen.zeit * 1000;
    S.restMs = rest === undefined ? gesamt : rest;
    S.letzterTick = Math.ceil(S.restMs / 1000);
    const bar = app.querySelector('#timer');
    if (!bar) return;
    const fill = bar.firstElementChild;
    fill.style.width = Math.max(0, (S.restMs / gesamt) * 100) + '%';
    S.timerId = setInterval(() => {
      S.restMs -= 100;
      const anteil = Math.max(0, S.restMs / gesamt);
      fill.style.width = (anteil * 100) + '%';
      bar.classList.toggle('low', anteil <= 0.3);
      const sek = Math.ceil(S.restMs / 1000);
      if (sek !== S.letzterTick && sek <= 5 && sek > 0) { Sound.tick(); S.letzterTick = sek; }
      if (S.restMs <= 0) { stoppeTimer(); antworten(null); }
    }, 100);
  }

  function stoppeTimer() {
    if (S.timerId) { clearInterval(S.timerId); S.timerId = null; }
  }

  /* ---------------------------------------------------------
     Antwort auswerten
     --------------------------------------------------------- */
  function antworten(i) {
    if (S.screen !== 'frage') return;
    const a = S.aktuell;
    const richtigIdx = a.antworten.indexOf(a.frage.r);
    wertung(i !== null && i === richtigIdx, {
      gewaehlt: i,
      abgelaufen: i === null,
      text: i === null ? '' : a.antworten[i]
    });
  }

  /* Kern der Auswertung – aus der Antwortauswahl wie aus der Moderatorwertung */
  function wertung(korrekt, o) {
    if (S.screen !== 'frage') return;
    stoppeTimer();
    S.screen = 'aufloesung';

    const a = S.aktuell;
    const p = spielerVon(a.pid);
    const richtigIdx = a.antworten.indexOf(a.frage.r);
    const dauer = (Date.now() - a.start) / 1000;

    a.gewaehlt = o.gewaehlt === undefined ? null : o.gewaehlt;
    a.korrekt = korrekt;
    a.abgelaufen = !!o.abgelaufen;
    a.gesagt = (o.text || '').trim();
    p.zeit += Math.min(dauer, S.einstellungen.zeit || 60);

    if (korrekt) {
      p.richtig++;
      if (!a.stechen) S.rundenPunkte[p.id] = (S.rundenPunkte[p.id] || 0) + 1;
      Sound.richtig();
    } else {
      p.falsch++;
      Sound.falsch();
      if (S.einstellungen.modus === 'leben' && !a.stechen) p.leben--;
    }
    if (a.stechen) S.stechen.ergebnisse[p.id] = korrekt;

    if (S.einstellungen.modus === 'voting' && !a.stechen) {
      S.protokoll.push({
        pid: p.id,
        frage: a.frage.f,
        antwort: a.gesagt || (a.abgelaufen ? '(keine Antwort)' : '(nicht notiert)'),
        richtigeAntwort: a.frage.r,
        korrekt
      });
    }

    zeigeAufloesung(richtigIdx);
  }

  /* Vertippt? Die letzte Wertung lässt sich umdrehen, solange nicht weitergeklickt wurde */
  function wertungUmdrehen() {
    if (S.screen !== 'aufloesung') return;
    const a = S.aktuell;
    const p = spielerVon(a.pid);
    const e = S.einstellungen;
    const lebenModus = e.modus === 'leben' && !a.stechen;

    // Alte Auswirkung zurücknehmen
    if (a.korrekt) {
      p.richtig--;
      if (!a.stechen) S.rundenPunkte[p.id] = Math.max(0, (S.rundenPunkte[p.id] || 0) - 1);
    } else {
      p.falsch--;
      if (lebenModus) p.leben++;
    }

    // Umgekehrte Wertung anwenden
    a.korrekt = !a.korrekt;
    a.abgelaufen = false;
    if (a.korrekt) {
      p.richtig++;
      if (!a.stechen) S.rundenPunkte[p.id] = (S.rundenPunkte[p.id] || 0) + 1;
      Sound.richtig();
    } else {
      p.falsch++;
      if (lebenModus) p.leben--;
      Sound.falsch();
    }
    if (a.stechen) S.stechen.ergebnisse[p.id] = a.korrekt;

    if (e.modus === 'voting' && !a.stechen && S.protokoll.length) {
      const letzter = S.protokoll[S.protokoll.length - 1];
      if (letzter.pid === p.id && letzter.frage === a.frage.f) letzter.korrekt = a.korrekt;
    }

    a.korrigiert = true;
    zeigeAufloesung(a.antworten.indexOf(a.frage.r));
  }

  function zeigeAufloesung(richtigIdx) {
    const a = S.aktuell;
    const p = spielerVon(a.pid);
    const modus = S.einstellungen.modus;

    let unter;
    if (a.korrekt) {
      unter = modus === 'leben'
        ? 'Kein Leben verloren.'
        : 'Ein Punkt für diese Runde.';
    } else if (a.abgelaufen) {
      unter = 'Zeit abgelaufen! Richtig wäre: ' + esc(a.frage.r);
    } else {
      unter = 'Richtig wäre: ' + esc(a.frage.r);
    }
    if (!a.korrekt && modus === 'leben' && !a.stechen) {
      unter += p.leben > 0
        ? ` · ${esc(p.name)} hat noch ${p.leben} ${p.leben === 1 ? 'Leben' : 'Leben'}.`
        : ` · ${esc(p.name)} hat kein Leben mehr!`;
    }

    app.innerHTML = kopf() + `
      <div class="card fade">
        <div class="meta">
          <span class="tag">${esc(a.frage.k)}</span>
          <span class="tag">${avatar(p, 'inline')} ${esc(p.name)}</span>
        </div>
        <div class="question">${esc(a.frage.f)}</div>
        ${S.einstellungen.moderator
          ? `<div class="loesung">
               <span class="loesung-label">Lösung</span>
               <span class="loesung-text">${esc(a.frage.r)}</span>
             </div>
             ${a.gesagt ? `<p class="hint">Geantwortet: „${esc(a.gesagt)}“</p>` : ''}`
          : `<div class="answers${a.frage.jn ? ' zwei' : ''}">
          ${a.antworten.map((t, i) => {
            let cls = 'answer dim';
            if (i === richtigIdx) cls = 'answer correct';
            else if (i === a.gewaehlt) cls = 'answer wrong';
            return `<button class="${cls}" disabled><span class="key">${KEYS[i]}</span><span>${esc(t)}</span></button>`;
          }).join('')}
        </div>`}
        <div class="verdict ${a.korrekt ? 'good' : 'bad'}">${a.korrekt ? 'Richtig! 🎉' : 'Falsch! 💀'}</div>
        <div class="verdict-sub">${unter}${a.korrigiert ? ' <em>(korrigiert)</em>' : ''}</div>
        <button class="btn block" id="weiter">Weiter</button>
        <div class="nebenknoepfe">
          <button class="btn ghost small" id="umdrehen">↺ ${a.korrekt ? 'Doch falsch' : 'Doch richtig'}</button>
          <button class="btn ghost small" id="melden" ${istGemeldet(a.frage) ? 'disabled' : ''}>
            ${istGemeldet(a.frage) ? '⚑ Gemeldet' : '⚑ Frage ist falsch'}
          </button>
        </div>
      </div>`;

    app.querySelector('#weiter').addEventListener('click', nachAufloesung);
    app.querySelector('#umdrehen').addEventListener('click', wertungUmdrehen);

    const melden = app.querySelector('#melden');
    if (melden && !melden.disabled) melden.addEventListener('click', () => {
      frageMelden(a.frage);
      melden.disabled = true;
      melden.textContent = '⚑ Gemeldet';
    });
  }

  function nachAufloesung() {
    const a = S.aktuell;
    const p = spielerVon(a.pid);

    if (a.stechen) {
      S.stechen.idx++;
      return stechenZug();
    }

    S.rIndex++;

    if (S.einstellungen.modus === 'leben' && p.leben <= 0) {
      return rauswurf(p, () => {
        if (spielEndeGeprueft()) return;
        if (S.rIndex >= S.reihenfolge.length) { S.runde++; rundeAufbauen(); }
        naechsterZug();
      });
    }

    if (S.rIndex >= S.reihenfolge.length && S.einstellungen.modus === 'leben') {
      S.runde++;
      rundeAufbauen();
    }
    naechsterZug();
  }

  /* ---------------------------------------------------------
     Rundenende (Rundenmodus)
     --------------------------------------------------------- */
  function rundeBeenden() {
    const e = S.einstellungen;

    if (e.modus === 'leben') {
      S.runde++;
      rundeAufbauen();
      return naechsterZug();
    }

    if (e.modus === 'voting') {
      // Erst wenn genug Runden gespielt sind, wird abgestimmt
      if (S.blockRunde < e.abstimmungNach) {
        return zeigeRundenstand(
          () => { S.blockRunde++; S.runde++; rundeAufbauen(); naechsterZug(); },
          `Noch ${e.abstimmungNach - S.blockRunde} Runde${e.abstimmungNach - S.blockRunde === 1 ? '' : 'n'}, dann wird abgestimmt.`,
          'Nächste Runde'
        );
      }
      return zeigeRundenstand(
        abstimmungStarten,
        'Alle haben geantwortet – jetzt entscheidet die Runde.',
        'Zur Abstimmung'
      );
    }

    const aktive = lebende();
    const min = Math.min(...aktive.map(p => S.rundenPunkte[p.id] || 0));
    const schlechteste = aktive.filter(p => (S.rundenPunkte[p.id] || 0) === min);

    if (schlechteste.length === 1) {
      zeigeRundenstand(() => rauswurf(schlechteste[0], nachRauswurf));
    } else {
      zeigeRundenstand(() => stechenStarten(schlechteste.map(p => p.id)));
    }
  }

  function nachRauswurf() {
    if (spielEndeGeprueft()) return;
    blockZuruecksetzen();
    S.runde++;
    rundeAufbauen();
    naechsterZug();
  }

  function zeigeRundenstand(weiter, hinweis, knopf) {
    S.screen = 'rundenende';
    const aktive = lebende().slice().sort((a, b) => (S.rundenPunkte[b.id] || 0) - (S.rundenPunkte[a.id] || 0));
    const min = Math.min(...aktive.map(p => S.rundenPunkte[p.id] || 0));
    const gleichstand = aktive.filter(p => (S.rundenPunkte[p.id] || 0) === min).length > 1;
    const text = hinweis || (gleichstand
      ? 'Gleichstand am Tabellenende – es gibt ein Stechen!'
      : 'Wer unten steht, fliegt gleich raus …');

    app.innerHTML = kopf() + `
      <div class="card fade">
        <h2>Runde ${S.runde} ist vorbei</h2>
        <p class="hint">${esc(text)}</p>
        <table class="standings">
          <tr><th>Spieler</th><th class="num">Diese Runde</th><th class="num">Gesamt richtig</th></tr>
          ${aktive.map(p => `
            <tr>
              <td>${avatar(p)} ${esc(p.name)}</td>
              <td class="num">${S.rundenPunkte[p.id] || 0}</td>
              <td class="num">${p.richtig}</td>
            </tr>`).join('')}
        </table>
        <br>
        <button class="btn block" id="weiter">${esc(knopf || (gleichstand ? 'Zum Stechen' : 'Wer fliegt raus?'))}</button>
      </div>`;
    app.querySelector('#weiter').addEventListener('click', weiter);
  }

  /* ---------------------------------------------------------
     Abstimmung: Welche Antwort war die dümmste?
     --------------------------------------------------------- */
  function abstimmungStarten() {
    const eintraege = S.protokoll.filter(e => spielerVon(e.pid).dabei);
    const falsche = eintraege.filter(e => !e.korrekt);
    const basis = falsche.length ? falsche : eintraege;

    S.abstimmung = {
      kandidaten: basis.map((e, i) => Object.assign({ key: i }, e)),
      nurFalsche: falsche.length > 0,
      waehler: lebende().map(p => p.id),
      idx: 0,
      stimmen: {}
    };
    abstimmungZug();
  }

  function abstimmungZug() {
    spielSichern();
    const ab = S.abstimmung;
    if (ab.idx >= ab.waehler.length) return abstimmungErgebnis();

    const waehler = spielerVon(ab.waehler[ab.idx]);
    // Wer nur über eigene Antworten abstimmen könnte, wird übersprungen
    if (!ab.kandidaten.some(k => k.pid !== waehler.id)) { ab.idx++; return abstimmungZug(); }

    if (uebergabeNoetig()) zeigeUebergabe(waehler, 'Abstimmung', zeigeAbstimmung);
    else zeigeAbstimmung();
  }

  function zeigeAbstimmung() {
    S.screen = 'abstimmung';
    const ab = S.abstimmung;
    const waehler = spielerVon(ab.waehler[ab.idx]);

    app.innerHTML = kopf() + `
      <div class="card fade">
        <div class="meta">
          <span class="tag">Abstimmung</span>
          <span class="tag">${avatar(waehler, 'inline')} ${esc(waehler.name)} stimmt ab</span>
          <span class="tag">${ab.idx + 1} / ${ab.waehler.length}</span>
        </div>
        <div class="question">Welche Antwort war die dümmste?</div>
        <div class="votes">
          ${ab.kandidaten.map(k => {
            const p = spielerVon(k.pid);
            const eigen = k.pid === waehler.id;
            const ohneText = k.antwort.startsWith('(');
            return `
              <button class="vote" data-key="${k.key}" ${eigen ? 'disabled' : ''}>
                <span class="vote-antwort">${ohneText ? esc(k.frage) : '„' + esc(k.antwort) + '“'}</span>
                <span class="vote-meta">${avatar(p, 'inline')} ${esc(p.name)}${ohneText ? ' · ' + esc(k.antwort) : ' · ' + esc(k.frage)}</span>
                <span class="vote-flag ${k.korrekt ? 'good' : 'bad'}">${k.korrekt
                  ? 'war richtig'
                  : 'richtig wäre: ' + esc(k.richtigeAntwort)}</span>
                ${eigen ? '<span class="vote-flag">deine eigene Antwort – nicht wählbar</span>' : ''}
              </button>`;
          }).join('')}
        </div>
        <p class="hint">${ab.nurFalsche
          ? 'Zur Auswahl stehen alle falschen Antworten seit der letzten Abstimmung.'
          : 'Diesmal lag niemand daneben – stimmt einfach über alle Antworten ab.'}</p>
      </div>`;

    app.querySelectorAll('.vote').forEach(b =>
      b.addEventListener('click', () => stimmeAb(Number(b.dataset.key))));
  }

  function stimmeAb(key) {
    if (S.screen !== 'abstimmung') return;
    const ab = S.abstimmung;
    ab.stimmen[key] = (ab.stimmen[key] || 0) + 1;
    ab.idx++;
    Sound.tick();
    abstimmungZug();
  }

  function abstimmungErgebnis() {
    S.screen = 'abstimmungsergebnis';
    const ab = S.abstimmung;

    const proSpieler = {};
    ab.kandidaten.forEach(k => {
      proSpieler[k.pid] = (proSpieler[k.pid] || 0) + (ab.stimmen[k.key] || 0);
    });
    const gewertet = Object.keys(proSpieler).map(Number)
      .map(pid => ({ p: spielerVon(pid), stimmen: proSpieler[pid] }))
      .sort((a, b) => b.stimmen - a.stimmen);
    const max = gewertet.length ? gewertet[0].stimmen : 0;
    const spitze = gewertet.filter(g => g.stimmen === max);
    const abgegeben = Object.values(ab.stimmen).reduce((a, b) => a + b, 0);

    app.innerHTML = kopf() + `
      <div class="card fade">
        <h2>Das Ergebnis der Abstimmung</h2>
        <p class="hint">${abgegeben} ${abgegeben === 1 ? 'Stimme' : 'Stimmen'} abgegeben.</p>
        <div class="tally">
          ${gewertet.map(g => `
            <div class="tally-row">
              <span class="tally-name">${avatar(g.p)} ${esc(g.p.name)}</span>
              <span class="tally-bar"><i style="width:${max ? (g.stimmen / max) * 100 : 0}%"></i></span>
              <span class="tally-zahl">${g.stimmen}</span>
            </div>`).join('')}
        </div>
        <div class="verdict ${spitze.length === 1 ? 'bad' : ''}">${spitze.length === 1
          ? esc(spitze[0].p.name) + ' hat die dümmste Antwort gegeben.'
          : 'Gleichstand – ' + esc(spitze.map(g => g.p.name).join(' und ')) + ' müssen ins Stechen!'}</div>
        <button class="btn block" id="weiter">${spitze.length === 1
          ? (S.einstellungen.leben > 1 ? 'Das kostet …' : 'Und tschüss!')
          : 'Zum Stechen'}</button>
      </div>`;

    app.querySelector('#weiter').addEventListener('click', () => {
      S.abstimmung = null;
      if (spitze.length === 1) bestrafen(spitze[0].p, nachRauswurf);
      else stechenStarten(spitze.map(g => g.p.id));
    });
  }

  /* ---------------------------------------------------------
     Stechen bei Gleichstand
     --------------------------------------------------------- */
  function stechenStarten(kandidaten) {
    S.stechen = { kandidaten, ergebnisse: {}, reihe: kandidaten.slice(), idx: 0 };
    stechenZug();
  }

  function stechenAuswerten() {
    const st = S.stechen;
    const falsche = st.kandidaten.filter(id => st.ergebnisse[id] === false);

    if (falsche.length === 1) {
      const p = spielerVon(falsche[0]);
      S.stechen = null;
      return bestrafen(p, nachRauswurf);
    }
    if (falsche.length > 1 && falsche.length < st.kandidaten.length) {
      st.kandidaten = falsche;
    }
    // alle richtig oder alle falsch: neue Stechrunde mit denselben Kandidaten
    st.ergebnisse = {};
    st.reihe = st.kandidaten.slice();
    st.idx = 0;

    S.screen = 'stechinfo';
    app.innerHTML = kopf() + `
      <div class="card turn-card fade">
        <span class="emoji" style="font-size:3rem">⚔️</span>
        <h2>Weiter im Stechen!</h2>
        <p class="hint">Noch dabei: ${st.kandidaten.map(id => esc(spielerVon(id).name)).join(', ')}</p>
        <br>
        <button class="btn" id="weiter">Nächste Stechfrage</button>
      </div>`;
    app.querySelector('#weiter').addEventListener('click', stechenZug);
  }

  /* ---------------------------------------------------------
     Rauswurf & Spielende
     --------------------------------------------------------- */
  /* Im Abstimmungsmodus kostet die dümmste Antwort ein Leben – sonst fliegt man sofort */
  function bestrafen(p, weiter) {
    if (S.einstellungen.modus === 'voting') {
      p.leben--;
      if (p.leben > 0) return zeigeLebenVerloren(p, weiter);
    }
    rauswurf(p, weiter);
  }

  function zeigeLebenVerloren(p, weiter) {
    S.screen = 'lebenverloren';
    Sound.falsch();
    const weg = Math.max(0, S.einstellungen.leben - p.leben);

    app.innerHTML = kopf() + `
      <div class="card boom warn">
        <span class="emoji">💔</span>
        <h2>${esc(p.name)} verliert ein Leben</h2>
        <p class="lives-big">${'❤'.repeat(p.leben)}${'🖤'.repeat(weg)}</p>
        <p class="hint">Noch ${p.leben} ${p.leben === 1 ? 'Leben' : 'Leben'} übrig · ${p.richtig} richtig, ${p.falsch} falsch</p>
        <br>
        <button class="btn" id="weiter">Weiter geht’s</button>
      </div>`;
    app.querySelector('#weiter').addEventListener('click', weiter);
  }

  function rauswurf(p, weiter) {
    S.screen = 'rauswurf';
    p.dabei = false;
    S.rausFolge.push(p.id);
    Sound.raus();

    const uebrig = lebende().length;
    app.innerHTML = kopf() + `
      <div class="card boom">
        <span class="emoji">🪂</span>
        <h2>${esc(p.name)} fliegt raus!</h2>
        <p class="hint">${p.richtig} richtig · ${p.falsch} falsch${uebrig > 1 ? ` · noch ${uebrig} Spieler im Rennen` : ''}</p>
        <br>
        <button class="btn" id="weiter">${uebrig === 1 ? 'Endstand ansehen' : (uebrig === 2 ? 'Auf ins Finale!' : 'Weiterspielen')}</button>
      </div>`;
    app.querySelector('#weiter').addEventListener('click', weiter);
  }

  function spielEndeGeprueft() {
    if (lebende().length <= 1) { zeigeEnde(); return true; }
    return false;
  }

  function zeigeEnde() {
    S.screen = 'ende';
    stoppeTimer();
    spielstandVerwerfen();
    Sound.sieg();

    const sieger = lebende()[0];
    const rangfolge = (sieger ? [sieger] : []).concat(
      S.rausFolge.slice().reverse().map(id => spielerVon(id))
    );
    const duemmster = S.rausFolge.length ? spielerVon(S.rausFolge[0]) : null;

    app.innerHTML = `
      <div class="card winner fade">
        <span class="crown">👑</span>
        <h2>${sieger ? esc(sieger.name) + ' gewinnt!' : 'Kein Sieger'}</h2>
        <p class="hint">${sieger ? `${sieger.richtig} richtige Antworten · ${sieger.falsch} Fehler` : ''}</p>
        ${duemmster ? `<p class="loser">Titel „Der Dümmste“: <b>${esc(duemmster.name)}</b> – zuerst rausgeflogen. 🫠</p>` : ''}
      </div>

      <div class="card">
        <h3>Endstand</h3>
        <table class="standings">
          <tr><th>Platz</th><th>Spieler</th><th class="num">Richtig</th><th class="num">Falsch</th><th class="num">Quote</th></tr>
          ${rangfolge.map((p, i) => {
            const ges = p.richtig + p.falsch;
            const quote = ges ? Math.round(p.richtig / ges * 100) + ' %' : '–';
            return `<tr class="${i === 0 ? '' : 'out'}">
              <td>${['🥇', '🥈', '🥉'][i] || (i + 1) + '.'}</td>
              <td>${avatar(p)} ${esc(p.name)}</td>
              <td class="num">${p.richtig}</td>
              <td class="num">${p.falsch}</td>
              <td class="num">${quote}</td>
            </tr>`;
          }).join('')}
        </table>
      </div>

      <div class="row">
        <button class="btn" id="revanche">Revanche – gleiche Spieler</button>
        <button class="btn ghost" id="neu">Zurück zur Einrichtung</button>
      </div>`;

    app.querySelector('#revanche').addEventListener('click', spielStarten);
    app.querySelector('#neu').addEventListener('click', zeigeSetup);
  }

  /* ---------------------------------------------------------
     Kopfzeile mit Punktestand
     --------------------------------------------------------- */
  function kopf() {
    const e = S.einstellungen;
    const gesamt = S.reihenfolge.length;
    // Auf Zwischenbildschirmen wäre der Fragenzähler nur verwirrend
    const zwischenschirm = ['rauswurf', 'lebenverloren', 'rundenende', 'abstimmungsergebnis', 'stechinfo', 'ende']
      .includes(S.screen);
    const fortschritt = S.stechen
      ? 'Stechen'
      : S.abstimmung
        ? 'Abstimmung'
        : zwischenschirm
          ? ''
          : `Frage ${Math.min(S.rIndex + 1, gesamt)} / ${gesamt}`;
    const block = e.modus === 'voting' && !S.stechen && !S.abstimmung && !zwischenschirm
      ? `Runde ${S.blockRunde} von ${e.abstimmungNach} bis zur Abstimmung`
      : '';
    const zeile = [`<strong>Runde ${S.runde}</strong>`, fortschritt, block].filter(Boolean).join(' · ');

    return `
      <div class="hud">
        <div>${zeile}</div>
        <div>${lebende().length} von ${S.spieler.length} noch dabei
          <button class="btn ghost small" id="abbrechen" style="margin-left:8px">Abbrechen</button>
        </div>
      </div>
      <div class="scorebar">
        ${S.spieler.map(p => {
          const aktiv = S.aktuell && S.aktuell.pid === p.id && ['frage', 'aufloesung', 'uebergabe'].includes(S.screen);
          const zeigtLeben = e.modus === 'leben' || (e.modus === 'voting' && e.leben > 1);
          const leben = zeigtLeben && p.dabei ? `<span class="lives">${'❤'.repeat(Math.max(0, p.leben))}</span>` : '';
          const punkte = e.modus !== 'leben' && p.dabei ? `<span class="lives">${S.rundenPunkte[p.id] || 0}</span>` : '';
          const hc = p.handicap ? `<span class="hc">${HANDICAP_ZEICHEN[p.handicap]}</span>` : '';
          return `<span class="score-pill ${p.dabei ? '' : 'out'} ${aktiv ? 'active' : ''}">
            ${avatar(p)}${esc(p.name)}${hc} ${leben}${punkte}
          </span>`;
        }).join('')}
      </div>`;
  }

  /* ---------------------------------------------------------
     Tastatur
     --------------------------------------------------------- */
  document.addEventListener('keydown', ev => {
    if (ev.target && ['INPUT', 'TEXTAREA'].includes(ev.target.tagName)) return;

    if (S.screen === 'frage') {
      const taste = ev.key.toLowerCase();

      if (S.einstellungen.moderator) {
        const feld = app.querySelector('#gesagt');
        const text = feld ? feld.value : '';
        if (taste === 'r') { ev.preventDefault(); return wertung(true, { text }); }
        if (taste === 'f') { ev.preventDefault(); return wertung(false, { text }); }
        if (!S.aktuell.optionenSichtbar) return;
      }

      const map = { '1': 0, '2': 1, '3': 2, '4': 3, a: 0, b: 1, c: 2, d: 3 };
      const i = map[taste];
      if (i !== undefined && i < S.aktuell.antworten.length) {
        ev.preventDefault();
        antworten(i);
      }
      return;
    }
    if (ev.key === ' ' || ev.key === 'Enter') {
      const btn = app.querySelector('#weiter') || app.querySelector('#start');
      if (btn) { ev.preventDefault(); btn.click(); }
    }
  });

  /* Abbrechen-Button (über Delegation, da er in jedem Kopf steckt) */
  app.addEventListener('click', ev => {
    const b = ev.target.closest('#abbrechen');
    if (!b) return;
    if (confirm('Spiel wirklich abbrechen?')) {
      stoppeTimer();
      S.aktuell = null;
      spielstandVerwerfen();
      zeigeSetup();
    }
  });

  /* ---------------------------------------------------------
     Los geht's
     --------------------------------------------------------- */
  laden();
  ladeGestellt();
  ladeGemeldet();
  zeigeSetup();
})();

</script>
</body>
</html>
